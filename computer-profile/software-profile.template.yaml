# Software Profile for Local Model Assessment
# Standalone: copy to software-profile.yaml and edit.
#   cp software-profile.template.yaml software-profile.yaml
# Optional LMO sidecar: LMO may own the live file; LMA consumes it via
# LMA_SOFTWARE_PROFILE, LMO_ROOT, or integrations/lmo/paths.yaml.
# See integrations/lmo/lma-lmo-contract.md.

# IDE (mandatory) - The integrated development environment running the model selector
ide:
  name: "Your IDE"
  url: "https://example.com/docs"
  settings_file: ".your-ide/settings.json"
  description: "Primary IDE for development and model selection"

# Embedded Coding Assistant (optional) - Comes with the IDE if available
embedded_assistant:
  name: "Built-in Assistant"
  url: "https://example.com/docs"
  settings_file: ".your-ide/settings.json"
  description: "Built-in chat assistant if available"
  optional: true
  derived_from_ide: true

# Primary Coding Assistant Agent (mandatory) - Main agent for executing tasks
primary_agent:
  name: "Your Primary Agent"
  url: "https://example.com/docs"
  settings_file: ".agent-config"
  description: "Primary AI coding agent for complex multi-step tasks"
  mandatory: true

# Additional Coding Assistant Agents (optional) - Can be used alongside primary agent
optional_agents:
  - name: "Secondary Agent"
    url: "https://example.com/docs"
    settings_file: ".agent-config"
    description: "Optional secondary coding assistant agent"
    optional: true

# Model Runtimes
# Ollama is the primary local stack for assessments, DB, provisioned clones, and IDE config generation.
# On Apple Silicon, Ollama may ship `-mlx` library tags; those stay on this runtime (not mlx-lm).
# MLX LM is a separate optional runtime for HuggingFace MLX safetensors with no Ollama tag.
# Models from mlx-community on HuggingFace use MLX LM. Ollama `-mlx` tags do not.
model_runtime:
  - name: "Ollama"
    url: "https://ollama.com"
    description: "Primary local model runtime — GGUF and Ollama -mlx tags, provisioned clones, IDE config"
    mandatory: true
  - name: "MLX LM"
    url: "https://github.com/ml-explore/mlx-lm"
    description: "Apple Silicon native runtime for HuggingFace MLX safetensors when no Ollama tag exists; optional"
    install: "uv pip install mlx-lm"
    mandatory: false
    platform: "macOS (Apple Silicon only)"
